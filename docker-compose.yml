version: '3.9'

# Database is Supabase cloud (eu-central-1) — no local postgres service needed.
# Dashboard: https://supabase.com/dashboard/project/ymlgvsgavfarbxomfhdt

services:
  backend:
    build: ./whatsy-backend
    env_file: ./whatsy-backend/.env
    ports:
      - "8080:8080"
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./whatsy-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    restart: on-failure
